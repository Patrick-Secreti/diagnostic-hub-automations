name: GitHub Development Notifications

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, closed]
  workflow_run:
    workflows:
      - OEM Service Monitor
      - Automotive News
      - ASE Question of the Day
      - Diagnostic Challenge
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send GitHub event to Slack
        env:
          SLACK_GITHUB_WEBHOOK_URL: ${{ secrets.SLACK_GITHUB_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.getenv("SLACK_GITHUB_WEBHOOK_URL", "")
          if not webhook:
              raise SystemExit("Missing SLACK_GITHUB_WEBHOOK_URL repository secret")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          name = os.environ["EVENT_NAME"]
          repo = os.environ["REPOSITORY"]
          link = os.environ["RUN_URL"]
          color = "#22B8CF"
          label = "View workflow"
          detail = ""
          if name == "push":
              heading = "Repository Update"
              branch = (event.get("ref") or "").removeprefix("refs/heads/")
              sha = (event.get("after") or "")[:7]
              rows = [("branch", branch), ("commit", sha), ("status", "RECEIVED")]
              detail = ((event.get("head_commit") or {}).get("message") or "New commit").splitlines()[0][:180]
          elif name == "pull_request":
              pr = event.get("pull_request") or {}
              action = event.get("action", "updated")
              status = "merged" if action == "closed" and pr.get("merged") else action
              heading = "Pull Request"
              rows = [("number", pr.get("number", "?")), ("status", status.upper())]
              detail = (pr.get("title") or "Pull request")[:180]
              link = pr.get("html_url") or link
              label = "Open PR"
              color = "#2EA043" if status == "merged" else "#22B8CF"
          elif name == "workflow_run":
              workflow = event.get("workflow_run") or {}
              conclusion = workflow.get("conclusion") or "unknown"
              heading =  (workflow.get("name") or "GitHub Actions")
              if heading == "ASE Question of the Day" and conclusion == "success":
                  print("ASE delivery result is reported directly by its workflow")
                  raise SystemExit(0)
              rows = [("branch", workflow.get("head_branch") or "unknown"), ("commit", (workflow.get("head_sha") or "")[:7]), ("status", ("WORKFLOW " + conclusion.upper()) if workflow.get("name") == "ASE Question of the Day" else conclusion.upper())]
              link = workflow.get("html_url") or link
              label = "View workflow run"
              color = "#2EA043" if conclusion == "success" else "#DA3633" if conclusion in ("failure", "timed_out", "action_required") else "#D29922"
          else:
              heading = "Notification Test"
              rows = [("status", "TEST")]
          def esc(value):
              return str(value).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace(chr(96), "'")
          values = dict(rows)
          status = esc(str(values.pop("status", "UNKNOWN")).replace("_", " ").upper())
          metadata = []
          if "branch" in values:
              metadata.append(esc(values["branch"]))
          if values.get("commit"):
              metadata.append(chr(96) + esc(values["commit"]) + chr(96))
          if "number" in values:
              metadata.append("#" + esc(values["number"]))
          metadata.append(f"<{link}|{label}>")
          title = "*" + esc(heading) + "*  ·  *" + status + "*"
          body = title + ("\n" + esc(detail) if detail else "")
          blocks = [{"type": "context", "elements": [{"type": "mrkdwn", "text": body + "\n" + " · ".join(metadata)}]}]
          data = json.dumps({"attachments": [{"fallback": heading + " — " + (detail or repo), "color": color, "blocks": blocks}]}).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              response_body = response.read().decode("utf-8", errors="replace")
              if response.status != 200 or response_body.strip() != "ok":
                  raise RuntimeError(f"Slack delivery failed: HTTP {response.status}: {response_body[:100]}")
          print("Slack notification delivered")
          PY
